server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      # El frontend (localhost:3000) llama al Gateway (localhost:8080) desde el
      # browser: son origenes distintos, asi que sin esto el navegador bloquea
      # el login (y todo lo demas) en el preflight, aunque curl no lo note.
      globalcors:
        cors-configurations:
          "[/**]":
            allowedOrigins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      # El Core (backend/api) tambien tiene su propio CORS (cors.allowed-origins),
      # asi que al proxear queda un header duplicado: el que agrega el Gateway +
      # el que ya trae la respuesta del Core. Los navegadores rechazan un
      # Access-Control-Allow-Origin repetido. Nos quedamos con el primero.
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
      routes:
        # Orden importa: core-auth debe ir antes que core-api, porque
        # /api/core/auth/** tambien matchea el predicate mas ancho de core-api.
        - id: core-auth
          uri: ${CORE_API_URL:http://localhost:8081}
          predicates:
            - Path=/api/core/auth/**
          filters:
            - RewritePath=/api/core/auth/(?<segment>.*), /auth/${segment}
        - id: core-api
          uri: ${CORE_API_URL:http://localhost:8081}
          predicates:
            - Path=/api/core/**
          filters:
            - JwtAuth
            - RewritePath=/api/core/(?<segment>.*), /api/${segment}
        - id: core-docs
          uri: ${CORE_API_URL:http://localhost:8081}
          predicates:
            - Path=/v3/api-docs/**,/swagger-ui/**,/swagger-ui.html
        - id: asistencias-api
          uri: ${ASISTENCIAS_API_URL:http://localhost:8083}
          predicates:
            - Path=/api/asistencias/**
          filters:
            - JwtAuth
        - id: notas-api
          uri: ${NOTAS_API_URL:http://localhost:8084}
          predicates:
            - Path=/api/examenes/**,/api/notas/**
          filters:
            - JwtAuth

# Misma clave y default que backend/security (application-security.yml).
# En Docker, ambas apps deben recibir el mismo JWT_SECRET (ver docker-compose.yml).
jwt:
  secret: ${JWT_SECRET:tu-clave-muy-segura-de-32-caracteres-o-mas-1234}

logging:
  level:
    root: info
    org.springframework.cloud.gateway: debug
