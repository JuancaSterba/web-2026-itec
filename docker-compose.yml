include:
  - backend/docker-compose.yml

services:
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: itec-api-gateway
    ports:
      - "8080:8080"
    environment:
      # Dentro de la red de Docker, el Core es alcanzable por el nombre del servicio,
      # no por localhost. Puerto 8082 = server.port real del perfil 'local' activo
      # (backend/.env: APP_PROFILE=local -> application-local.yml). En 'prod' sería 8081.
      - CORE_API_URL=http://backend-app:8082
      - ASISTENCIAS_API_URL=http://ms-asistencias:8083
      - NOTAS_API_URL=http://ms-notas:8084
      # Debe ser IDENTICO al JWT_SECRET de backend-app (ver backend/docker-compose.yml)
      # para poder validar los tokens que el Core emite. Este archivo no tiene su
      # propio .env, asi que solo toma un valor distinto del default si exportas
      # JWT_SECRET en la shell antes de "docker compose up" (mayor precedencia
      # que cualquier .env). Si backend/.env define un JWT_SECRET propio, hay que
      # exportarlo tambien aca para que ambos coincidan.
      - JWT_SECRET=${JWT_SECRET:-tu-clave-muy-segura-de-32-caracteres-o-mas-1234}
    depends_on:
      - backend-app
      - ms-asistencias
      - ms-notas

  ms-asistencias:
    build:
      context: .
      dockerfile: ms-asistencias/Dockerfile
    container_name: itec-ms-asistencias
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      # mysql-db es el nombre del servicio (alcanzable tambien como itec-mysql,
      # su container_name, ya que Docker agrega ambos como alias de red).
      # db_asistencias es un esquema logico propio, separado de backoffice_itec
      # (aislamiento logico: mismo servidor MySQL, sin JOINs entre servicios).
      # createDatabaseIfNotExist evita el error de "unknown database" en el primer arranque.
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/db_asistencias?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${DB_ROOT_PASSWORD:-root}
      # application-prod.yml por defecto usa ddl-auto=validate; en el primer arranque
      # el esquema esta vacio, asi que necesitamos "update" para que Hibernate cree las tablas.
      - DB_DDL_AUTO=update
    depends_on:
      mysql-db:
        condition: service_healthy

  ms-notas:
    build:
      context: .
      dockerfile: ms-notas/Dockerfile
    container_name: itec-ms-notas
    ports:
      - "8084:8084"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      # db_calificaciones es su propio esquema logico, igual criterio que db_asistencias.
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/db_calificaciones?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${DB_ROOT_PASSWORD:-root}
      - DB_DDL_AUTO=update
    depends_on:
      mysql-db:
        condition: service_healthy

  frontend-app:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: itec-frontend
    ports:
      - "3000:3000"
    environment:
      # NEXT_PUBLIC_* corre en el browser del HOST (no dentro de la red docker),
      # asi que apunta al puerto publicado del Gateway en localhost. Nunca a
      # Core (8081/8082) ni a los microservicios directo -- criterio de
      # aceptacion del plan de frontend. Esta variable tiene precedencia sobre
      # frontend/.env.local dentro del contenedor (Next.js no pisa un
      # process.env ya seteado), asi que es la fuente real cuando se corre con Docker.
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    depends_on:
      - api-gateway
